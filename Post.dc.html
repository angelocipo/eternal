<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
<link rel="stylesheet" href="fonts/fonts.css">
<script src="i18n.js"></script>
<script src="chrome.js"></script>
<style>
html,body{margin:0;padding:0;background:#0e1524;}
a{color:inherit;}
.ech{--gold:#cfd3da;--color-accent:#cfd3da;--color-bg:#0e1524;--color-neutral-700:#a3abba;background:#0e1524;color:#eef0f4;font-family:Jost,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.45;}
.ech *{box-sizing:border-box;}
.ech a{color:inherit;text-decoration:none;}
.ech-nav{position:sticky;top:0;z-index:30;background:rgba(14,21,36,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(185,190,200,.16);}
.ech-navin{max-width:1240px;margin:0 auto;padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.ech-navlinks{display:flex;gap:22px;flex-wrap:wrap;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#a3abba;}
.ech-navlinks a:hover{color:var(--gold);}
.ech-navlinks a[aria-current]{color:var(--gold);}
.ech-btn,.ech a.ech-btn{display:inline-block;font-weight:400;letter-spacing:.24em;font-size:11px;text-transform:uppercase;color:#0e1524;background:var(--gold);padding:15px 34px;border-radius:2px;transition:background .25s,transform .25s;}
.ech-btn:hover{background:#d9dce2;transform:translateY(-2px);}
.ech-btn:focus-visible{outline:2px solid #cfd3da;outline-offset:3px;}
.ech-ghost,.ech a.ech-ghost{display:inline-block;font-weight:400;letter-spacing:.24em;font-size:11px;text-transform:uppercase;color:#e6e9ee;border:1px solid rgba(185,190,200,.5);padding:15px 34px;border-radius:2px;}
.ech-ghost:hover{background:rgba(185,190,200,.1);border-color:var(--gold);}
.ech-body p{font-weight:300;font-size:16.5px;line-height:1.85;color:#bcc2cd;margin:0 0 22px;white-space:pre-line;}
.ech-split{max-width:1000px;margin:0 auto;padding:44px 28px 10px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,42%);gap:48px;align-items:start;}
.ech-hero{margin:0;position:sticky;top:96px;}
@media(max-width:820px){.ech-split{grid-template-columns:1fr !important;gap:28px;}.ech-hero{position:static;order:-1;}}
.ech-gal{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:start;justify-items:center;}
/* Never enlarged beyond the file's own size: small photos stay sharp instead of being stretched. */
.ech-gal img{width:auto;height:auto;max-width:100%;display:block;border:1px solid rgba(185,190,200,.16);border-radius:4px;}
.ech-more a:hover{border-color:rgba(185,190,200,.55);}
.ech a.ech-arrow{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:1px solid rgba(185,190,200,.3);border-radius:50%;color:#cfd3da;font-size:17px;transition:border-color .25s,background .25s;}
.ech a.ech-arrow:hover{border-color:var(--gold);background:rgba(185,190,200,.08);}
.ech-pn{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.ech a.ech-pnlink{display:flex;flex-direction:column;gap:8px;padding:22px 24px;border:1px solid rgba(185,190,200,.16);border-radius:4px;transition:border-color .25s;}
.ech a.ech-pnlink:hover{border-color:rgba(185,190,200,.55);}
.ech-pnnext{grid-column:2;text-align:right;}
.ech-pnlab{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#a3abba;}
.ech-pntitle{font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;line-height:1.2;color:#e6e9ee;}
@media(max-width:640px){.ech-pn{grid-template-columns:1fr;}.ech-pnnext{grid-column:auto;}.ech-pntitle{font-size:19px;}}

@media(max-width:640px){.ech article,.ech-split,.ech-more,.ech > section,.ech > nav{padding-left:18px !important;padding-right:18px !important;}.ech-body p{font-size:15.5px;}}
.ech img{max-width:100%;}
html,body{overflow-x:hidden;}
</style>
<script defer src="consent.js"></script>
</helmet>
<div class="ech">

  <div data-ecj-nav=""></div>

  <article style="max-width:1000px;margin:0 auto;padding:56px 28px 20px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:34px;">
      <nav aria-label="Breadcrumb" style="font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#656e80;min-width:0;">
        <a href="journal.html" style="color:#a3abba;" style-hover="color:#cfd3da">Journal</a> &nbsp;/&nbsp; <span>{{ title }}</span>
      </nav>
      <div style="display:flex;gap:8px;flex-shrink:0;">
        <a class="ech-arrow" href="{{ prevHref }}" title="{{ prevTitle }}" aria-label="Previous post" style="{{ prevStyle }}">&larr;</a>
        <a class="ech-arrow" href="{{ nextHref }}" title="{{ nextTitle }}" aria-label="Next post" style="{{ nextStyle }}">&rarr;</a>
      </div>
    </div>

    <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px;">
      <span style="font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#656e80;">{{ dateLabel }}</span>
      <span style="{{ mohsStyle }};font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:#0e1524;background:#cfd3da;padding:5px 11px;border-radius:2px;">Mohs {{ mohs }}</span>
    </div>

    <h1 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:clamp(38px,6vw,72px);line-height:1.02;color:#f1f3f6;margin:0;">{{ title }}</h1>
    <p style="{{ subtitleStyle }};font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:clamp(20px,2.6vw,28px);color:#d9dce2;margin:16px 0 0;">{{ subtitle }}</p>
    <p style="{{ leadStyle }};font-weight:300;font-size:19px;line-height:1.7;color:#d3d8e0;max-width:60ch;margin:26px 0 0;">{{ lead }}</p>
  </article>

  <!-- Text on the left, main photo on the right at the same height; stacked (photo first) on phones. -->
  <div class="ech-split" style="{{ splitStyle }}">
    <section class="ech-body">
      <sc-for list="{{ paras }}" as="para" hint-placeholder-count="3">
        <p>{{ para }}</p>
      </sc-for>
    </section>
    <figure class="ech-hero" style="{{ heroStyle }}">
      <img src="{{ image }}" alt="{{ title }}" style="width:auto;height:auto;max-width:100%;max-height:560px;display:block;margin:0 auto;border:1px solid rgba(185,190,200,.16);border-radius:4px;">
      <figcaption style="{{ heroNoteStyle }};font-size:12.5px;line-height:1.6;color:#757f93;font-style:italic;text-align:center;margin-top:10px;">{{ logoNote }}</figcaption>
    </figure>
  </div>

  <section style="{{ galStyle }};max-width:1000px;margin:0 auto;padding:20px 28px 10px;">
    <div class="ech-gal">
      <sc-for list="{{ gallery }}" as="g" hint-placeholder-count="3">
        <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:8px;">
          <img src="{{ g.src }}" alt="{{ title }}" loading="lazy">
          <figcaption style="{{ g.noteStyle }};font-size:12px;line-height:1.55;color:#757f93;font-style:italic;text-align:center;">{{ logoNote }}</figcaption>
        </figure>
      </sc-for>
    </div>
  </section>

  <section style="max-width:1000px;margin:0 auto;padding:44px 28px 0;">
    <div style="display:flex;gap:8px;margin-bottom:22px;">
      <a class="ech-arrow" href="{{ prevHref }}" title="{{ prevTitle }}" aria-label="Previous post" style="{{ prevStyle }}">&larr;</a>
      <a class="ech-arrow" href="{{ nextHref }}" title="{{ nextTitle }}" aria-label="Next post" style="{{ nextStyle }}">&rarr;</a>
    </div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;">
      <a class="ech-btn" href="collection.html">Shop the collection</a>
      <a class="ech-ghost" href="compendium.html">All 54 stones</a>
    </div>
  </section>

  <nav aria-label="More posts" class="ech-pn" style="max-width:1000px;margin:0 auto;padding:56px 28px 0;">
    <a href="{{ prevHref }}" style="{{ prevStyle }}" class="ech-pnlink">
      <span class="ech-pnlab">&larr; Previous</span>
      <span class="ech-pntitle">{{ prevTitle }}</span>
    </a>
    <a href="{{ nextHref }}" style="{{ nextStyle }}" class="ech-pnlink ech-pnnext">
      <span class="ech-pnlab">Next &rarr;</span>
      <span class="ech-pntitle">{{ nextTitle }}</span>
    </a>
  </nav>

  <section class="ech-more" style="max-width:1240px;margin:0 auto;padding:80px 28px 90px;">
    <h2 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:32px;color:#eceff3;margin:0 0 26px;">Keep reading</h2>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px;">
      <sc-for list="{{ more }}" as="m" hint-placeholder-count="3">
        <a href="{{ m.href }}" style="display:block;border:1px solid rgba(185,190,200,.14);border-radius:4px;overflow:hidden;background:#131c30;">
          <img src="{{ m.image }}" alt="{{ m.title }}" loading="lazy" style="width:100%;aspect-ratio:4/3;object-fit:cover;display:block;">
          <span style="display:block;padding:18px 20px 22px;">
            <span style="display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#656e80;">{{ m.dateLabel }}</span>
            <span style="display:block;font-family:'Cormorant Garamond',Georgia,serif;font-size:23px;color:#e6e9ee;margin-top:8px;line-height:1.15;">{{ m.title }}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <div data-ecj-footer></div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { posts: [], slug: '' };

  componentDidMount() {
    let slug = '';
    try { slug = new URLSearchParams(window.location.search).get('slug') || decodeURIComponent((window.location.pathname.match(/^\/journal\/([^/]+)/) || [])[1] || ''); } catch (e) {}
    fetch('data/posts.json')
      .then(r => r.json())
      .then(posts => this.setState({ posts, slug }))
      .catch(() => this.setState({ posts: [], slug }));
    // Left / right arrow keys move between posts (ignored while typing in a field).
    this._key = e => {
      if (e.altKey || e.ctrlKey || e.metaKey || /input|textarea|select/i.test((e.target && e.target.tagName) || '')) return;
      const n = this._nav || {};
      const href = e.key === 'ArrowLeft' ? n.prev : e.key === 'ArrowRight' ? n.next : '';
      if (href) window.location.href = href;
    };
    window.addEventListener('keydown', this._key);
  }
  componentWillUnmount() { window.removeEventListener('keydown', this._key); }

  fmt(d) {
    return new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  renderVals() {
    const { posts, slug } = this.state;
    const p = posts.find(x => x.slug === slug) || posts[0];
    if (!p) return { title: '', paras: [], gallery: [], more: [] };
    // Photos taken before the rebrand show the old "diAngelo" tag: say so under each of them.
    const oldLogo = p.oldLogo || [];
    const noteStyle = u => (oldLogo.indexOf(u) > -1 ? 'display:block' : 'display:none');
    const gallery = (p.images || []).filter(u => u !== p.image).slice(0, 4).map(u => ({ src: u, noteStyle: noteStyle(u) }));
    const more = posts.filter(x => x.slug !== p.slug && x.image && x.kind === p.kind).slice(0, 3).map(x => ({
      href: '/journal/' + x.slug,
      title: x.title,
      image: x.image,
      dateLabel: this.fmt(x.date),
    }));
    // Previous / next in the same order as the Journal page (newest first, only posts with text).
    const list = posts.filter(x => x.lead || (x.paras && x.paras.length));
    const i = list.findIndex(x => x.slug === p.slug);
    const prev = i > 0 ? list[i - 1] : null;
    const next = i > -1 && i < list.length - 1 ? list[i + 1] : null;
    this._nav = { prev: prev ? '/journal/' + prev.slug : '', next: next ? '/journal/' + next.slug : '' };
    return {
      prevHref: this._nav.prev || '#', prevTitle: prev ? prev.title : '', prevStyle: prev ? '' : 'visibility:hidden',
      nextHref: this._nav.next || '#', nextTitle: next ? next.title : '', nextStyle: next ? '' : 'visibility:hidden',
      title: p.title,
      subtitle: p.subtitle || '',
      subtitleStyle: p.subtitle ? '' : 'display:none',
      lead: p.lead || '',
      leadStyle: p.lead ? '' : 'display:none',
      mohs: p.mohs || '',
      mohsStyle: p.mohs ? 'display:inline-block' : 'display:none',
      dateLabel: this.fmt(p.date),
      image: p.image || '',
      heroStyle: p.image ? '' : 'display:none',
      // Side by side only when there is both text and a photo; otherwise one centred column.
      splitStyle: p.image && (p.paras || []).length ? '' : 'grid-template-columns:minmax(0,1fr)',
      heroNoteStyle: noteStyle(p.image),
      logoNote: 'Archive photo: the tag shows our former diAngelo brand. Every piece now carries the Eternal City Jewelry tag.',
      paras: p.paras || [],
      gallery,
      galStyle: gallery.length ? '' : 'display:none',
      more,
    };
  }
}
</script>
</body>
</html>
